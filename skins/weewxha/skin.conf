###############################################################################
# skin.conf for the weewxha skin                                            #
#                                                                            #
# Renders a small human-friendly dashboard (index.html) and a machine       #
# readable data file (weewxha.json) that the "WeeWX-HA" Home Assistant      #
# custom integration polls for sensor state.                                #
#                                                                            #
# Compatible with WeeWX 4.x and 5.x.                                        #
###############################################################################

SKIN_NAME = weewxha
SKIN_VERSION = 0.5.0

[Extras]
    # Free-form text shown on the dashboard; edit to taste.
    subtitle = Home Assistant data feed

    # How often the dashboard updates itself, in seconds. With JavaScript the
    # changed sections are swapped in and the radar frame is left running;
    # without it, the page reloads wholesale as it used to. Set to 0 to stop
    # updating altogether.
    refresh_seconds = 120

[Forecast]
    # Zambretti forecast, computed locally from your own barometer history --
    # no internet forecast service involved. Appears on the dashboard and in
    # weewxha.json under "forecast".
    enable = true

    # Window used for the pressure trend, in seconds. 3 hours is the period
    # the Zambretti tables were built around.
    trend_period = 10800

    # Expected local pressure range, in hPa. Readings are normalised onto this
    # range, so a station that never sees the extremes of the default 950-1050
    # can narrow it and get the full spread of forecasts rather than only the
    # middle ones.
    baro_lower = 950.0
    baro_upper = 1050.0

    # Database binding holding the pressure history.
    data_binding = wx_binding

    # Optional: take the pressure from a Home Assistant sensor instead of the
    # station's own barometer -- for stations that have no barometer. WeeWX
    # must be able to reach Home Assistant, and needs a long-lived access
    # token (Home Assistant: profile -> Security -> Long-lived access tokens).
    #
    # The entity must report SEA-LEVEL pressure, the same thing WeeWX calls
    # "barometer". A sensor reporting absolute/station pressure will produce a
    # wrong forecast unless you correct it for altitude first.
    #
    # Readings are appended to a small local history file so the trend can be
    # measured; expect no trend until trend_period has elapsed after setup.
    [[HomeAssistant]]
        enable = false
        url = http://homeassistant.local:8123
        barometer_entity_id = sensor.outdoor_pressure

        # Prefer token_file: weewx.conf is usually world-readable, so a token
        # in it is readable by every user on the machine.
        #token_file = /etc/weewx/ha_token
        token =

        # Seconds to wait on Home Assistant before giving up and falling back
        # to the station barometer.
        timeout = 10

        # Optional: take the inside temperature and humidity from Home
        # Assistant too, for a station with no console sensors. Each is
        # independent -- set either, both or neither. They are converted
        # into this skin's units and appear alongside the station's own
        # readings, labelled on the dashboard as coming from Home Assistant.
        #inside_temperature_entity_id = sensor.living_room_temperature
        #inside_humidity_entity_id = sensor.living_room_humidity
        # Only if the temperature entity has no unit_of_measurement: C, F or K
        #inside_unit = C

        # TLS, for an https URL. Verification is on by default. If Home
        # Assistant uses a certificate from a private CA -- common on an
        # internal network -- point ca_file at that CA certificate, or install
        # it in the system trust store. Setting verify = false accepts any
        # certificate and exposes the access token to anything on the network
        # path; it is a last resort.
        #ca_file = /etc/ssl/certs/internal-ca.pem
        verify = true

        # Is the entity reporting sea-level pressure, or the absolute
        # pressure where it sits? Zambretti needs sea level. Many cheap
        # sensors report absolute, which at any altitude reads low --
        # about 29 hPa at 250 m -- and gives a confidently wrong forecast
        # with nothing on the page to show it. Set 'absolute' and the
        # reading is reduced to sea level using the station altitude and
        # outside temperature.
        #   sealevel -- already corrected (the default)
        #   absolute -- raw sensor pressure, correct it here
        pressure_type = sealevel

        # Only needed if the entity has no unit_of_measurement attribute.
        # One of: Pa, hPa, mbar, kPa, bar, cbar, mmHg, inHg, psi
        #unit = hPa

        # Defaults to weewxha_pressure.json beside the WeeWX database.
        #history_file = /var/lib/weewx/weewxha_pressure.json

    # Optional: override any of the 26 forecast phrases, keyed by Zambretti
    # letter code, e.g. to translate them.
    #[[Texts]]
    #    A = Settled fine
    #    Z = Stormy, much rain

[History]
    # Past forecasts, and the charts drawn from them. WeeWX archives what the
    # station measured but never what was predicted, so this keeps its own
    # record -- and it is the only source for a Home Assistant pressure, which
    # never reaches the archive at all.
    enable = true

    # How long past forecasts are kept, in seconds.
    retention = 604800

    # What the charts cover, and how finely the archive is sampled for them.
    chart_span = 86400
    chart_interval = 1800

    # Which observations get a chart. Any WeeWX observation type works; one
    # your station doesn't record simply produces no chart, the same way it
    # gets no Home Assistant entity. Rain is totalled per interval and gusts
    # are taken at their peak rather than averaged.
    #
    # Wind direction is refused: it is circular, so averaging 350 and 10
    # degrees gives south, which is wrong rather than merely imprecise.
    observations = outTemp, outHumidity, barometer, windSpeed, rain

    # Defaults to weewxha_forecast_history.json beside the WeeWX database.
    #history_file =

[NWS]
    # Forecast, alerts and radar from the US National Weather Service.
    # api.weather.gov needs no key, but it does require a User-Agent naming
    # your application and a contact address. US coverage only.
    enable = false

    # Identify yourself to the NWS. They ask for a contact address so they can
    # get in touch about traffic rather than simply blocking it.
    user_agent = weewxha (you@example.com)

    # Defaults to the station's own latitude/longitude from [Station].
    #latitude =
    #longitude =

    # How long each document is kept before refetching, in seconds. The
    # location lookup is cached for a week regardless -- a grid square does
    # not move.
    forecast_ttl = 1800
    alerts_ttl = 300

    timeout = 15

    # Radar site, e.g. KDIX. Defaults to whichever one covers the station.
    #radar_station =

    # How the radar is shown:
    #   default  -- radar.weather.gov exactly as it comes, with nothing
    #               imposed: whatever layer and framing the NWS ships.
    #   enhanced -- the local single-site view centred on your station.
    #               Super-resolution reflectivity, which shows clear-air
    #               clutter as speckle on a quiet day.
    #   standard -- the station's regional composite page.
    #   image    -- the cached GIF loop. Much lighter, and the only one
    #               that works with no internet at the viewer's end.
    # Either frame falls back to the cached image if it fails to load.
    radar_mode = default
    radar_height = 460

    # Map zoom for the enhanced view, centred on the station's own
    # coordinates. 8 covers a metropolitan area; higher is closer in.
    radar_zoom = 8

    # Keep a local copy of the radar loop beside the dashboard. It is what
    # gets shown when the live radar cannot be reached -- unlike the frame
    # or the remote GIF, it needs nothing but the web server already
    # serving this page. Roughly 50-250 kB per refresh.
    radar_cache = true
    radar_cache_ttl = 600

    # Defaults to weewxha_nws.json beside the WeeWX database.
    #cache_file =

[Units]
    [[Groups]]
        # Overridable per-installation in weewx.conf under
        # [StdReport][[weewxha]][[[Units]]][[[[Groups]]]]. Defaults to US
        # customary units, matching WeeWX's own stock defaults.
        group_altitude     = foot
        group_degree_day   = degree_F_day
        group_direction    = degree_compass
        group_moisture     = centibar
        group_percent      = percent
        group_pressure     = inHg
        group_radiation    = watt_per_meter_squared
        group_rain         = inch
        group_rainrate     = inch_per_hour
        group_speed        = mile_per_hour
        group_speed2       = mile_per_hour2
        group_temperature  = degree_F
        group_uv           = uv_index
        group_volt         = volt

[Labels]
    [[Generic]]
        outTemp        = Outside Temperature
        inTemp         = Inside Temperature
        outHumidity    = Outside Humidity
        inHumidity     = Inside Humidity
        dewpoint       = Dew Point
        heatindex      = Heat Index
        windchill      = Wind Chill
        barometer      = Barometer
        windSpeed      = Wind Speed
        windGust       = Wind Gust
        windDir        = Wind Direction
        windGustDir    = Gust Direction
        rainRate       = Rain Rate
        rain           = Rain Total
        radiation      = Solar Radiation
        UV             = UV Index
        consBatteryVoltage = Console Battery
        rxCheckPercent = Signal Quality

[CheetahGenerator]
    search_list_extensions = user.weewxha_search.WeewxHaSearchList

    [[ToDate]]
        [[[weewxha_index]]]
            encoding = html_entities
            template = index.html.tmpl

        [[[weewxha_data]]]
            encoding = utf8
            template = weewxha.json.tmpl

[CopyGenerator]
    copy_once = static/weewxha.css

[Generators]
    generator_list = weewx.cheetahgenerator.CheetahGenerator, weewx.reportengine.CopyGenerator
